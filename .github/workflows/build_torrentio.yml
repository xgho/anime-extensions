name: Build Torrentio Extension

on:
  push:
    branches: [master]
    paths:
      - 'src/all/torrentioanime/**'
      - '.github/workflows/build_torrentio.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore signing.jks \
            -storepass android \
            -keypass android \
            -dname "CN=xgho, OU=Personal, O=Personal, L=Unknown, ST=Unknown, C=US"

      - name: Build Torrentio APK
        run: |
          ./gradlew src:all:torrentioanime:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/signing.jks \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=release \
            -Pandroid.injected.signing.key.password=android

      - name: Prepare repo branch
        run: |
          mkdir -p repo-output/apk
          mkdir -p repo-output/icon

          APK_PATH=$(find src/all/torrentioanime/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            exit 1
          fi

          VERSION_CODE=$(grep 'extVersionCode' src/all/torrentioanime/build.gradle | grep -o '[0-9]*')

          APK_NAME="aniyomi-all.torrentioanime-v14.${VERSION_CODE}.apk"
          cp "$APK_PATH" "repo-output/apk/$APK_NAME"

          ICON_PATH="src/all/torrentioanime/res/mipmap-xxxhdpi/ic_launcher.png"
          PKG="eu.kanade.tachiyomi.animeextension.all.torrentioanime"
          if [ -f "$ICON_PATH" ]; then
            cp "$ICON_PATH" "repo-output/icon/${PKG}.png"
          fi

          printf '[{"name":"Aniyomi: Torrentio Anime (Torrent / Debrid)","pkg":"eu.kanade.tachiyomi.animeextension.all.torrentioanime","apk":"%s","lang":"all","code":%s,"version":"14.%s","nsfw":0,"hasReadme":0,"hasChangelog":0,"sources":[{"name":"Torrentio Anime (Torrent / Debrid)","lang":"all","id":"7490206640756700883","baseUrl":"https://torrentio.strem.fun"}]}]' "$APK_NAME" "$VERSION_CODE" "$VERSION_CODE" > repo-output/index.min.json

          echo "Built APK: $APK_NAME"
          echo "Version code: $VERSION_CODE"
          echo "Repo structure:"
          find repo-output -type f
          echo "index.min.json contents:"
          cat repo-output/index.min.json

      - name: Deploy to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo-output
          publish_branch: repo
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
